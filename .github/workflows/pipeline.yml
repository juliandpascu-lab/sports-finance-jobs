name: Daily Sports Finance Job Watcher

on:
  schedule:
    # 23:00 UTC = 5:00 PM Central while America/Chicago is on CST.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Configure commit identity
        run: |
          git config user.name "sports-finance-job-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch feeds, rebuild history, update Issue, and commit data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m job_watcher.cli run
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
